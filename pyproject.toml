[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsieve"
version = "0.1.0"
description = "Stream and parse log files without loading them into memory"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "lisa-w884"}]

[tool.setuptools.packages.find]
where = ["src"]
